\* One request at a time; a request may die between two statements. Requests: sync.
\* check.sh runs this file once for each rule that expected.tsv lists for it.
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  MaxVer = 3
  MaxHist = 5
  MaxOps = 4
  MaxInFlight = 1
  Kinds = {"sync"}
  Crashes = TRUE
  EchoRemovals = TRUE
SYMMETRY TxnSymmetry
INVARIANTS TypeOK NoMissing NoGhost NoStale NoRejectedInsert
