\* Two requests may run at the same time; none dies. Requests: sync.
\* check.sh runs this file once for each rule that expected.tsv lists for it.
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  MaxVer = 3
  MaxHist = 5
  MaxOps = 3
  MaxInFlight = 2
  Kinds = {"sync"}
  Crashes = FALSE
  EchoRemovals = TRUE
SYMMETRY TxnSymmetry
INVARIANTS TypeOK NoMissing NoGhost NoStale NoRejectedInsert
