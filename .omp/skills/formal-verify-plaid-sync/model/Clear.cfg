\* One request at a time and none dies. Requests: sync and Clear.
\* check.sh runs this file once for each rule that expected.tsv lists for it.
SPECIFICATION Spec
CONSTANTS
  Txns = {t1, t2}
  MaxVer = 3
  MaxHist = 5
  MaxOps = 4
  MaxInFlight = 1
  Kinds = {"sync", "clear"}
  Crashes = FALSE
  EchoRemovals = TRUE
SYMMETRY TxnSymmetry
INVARIANTS TypeOK NoMissing NoGhost NoStale NoRejectedInsert
