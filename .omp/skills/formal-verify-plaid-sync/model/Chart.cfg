\* The smallest serial scenario: one transaction, one sync, none dies.
\* check.sh does not run it. It is small enough to draw as one chart.
SPECIFICATION Spec
CONSTANTS
  Txns = {t1}
  MaxVer = 1
  MaxHist = 3
  MaxOps = 1
  MaxInFlight = 1
  Kinds = {"sync"}
  Crashes = FALSE
  EchoRemovals = TRUE
INVARIANTS TypeOK NoMissing NoGhost NoStale NoRejectedInsert
